# Publishes a version of Hermes. Two ways to start it, both naming the same thing:
#
#   * push a branch called `release/v<version>`, e.g. `release/v1.4.0`
#   * run it from the Actions tab and type the version into the form
#
# Either way the version is the single source of truth: it names the image tags, the git tag and
# the release. The `prepare` job resolves it from whichever source fired and validates it, so a
# typo or an already-published version fails in seconds rather than after a full build.
#
# In order: the Rust DNS workspace and the .NET management backend are tested, then all three
# container images (DNS, management API, dashboard) are built and pushed to GHCR and the frontend
# is bundled as a zip. Finally a GitHub release is cut at the commit being published, carrying the
# Linux DNS binary and that zip. The binary is lifted out of the image that was just pushed, so
# the release and the image are the same build rather than two compiles that happen to agree.
#
# Pushing again to an existing release/v* branch re-runs the publish. That is the way to retry a
# run that failed partway: the git tag is only created in the very last job, so a failed attempt
# leaves nothing behind to collide with. Once a version has actually been published, a re-run
# stops at the duplicate check in `prepare`.
name: Publish

on:
  push:
    branches: ["release/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without a leading v — e.g. 1.4.0, or 1.4.0-rc.1 for a prerelease"
        required: true
        type: string

permissions:
  contents: read

# Queue rather than cancel: a half-pushed set of images is worse than a slow one. Keyed by the
# version being published, so 1.4.1 does not wait behind an unrelated 1.5.0 run.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # docker/metadata-action lowercases these, which matters here: the owner is `Xander1233` and
  # GHCR only accepts lowercase image names.
  DNS_IMAGE: ${{ github.repository }}/dns
  MGMT_IMAGE: ${{ github.repository }}/management
  FRONTEND_IMAGE: ${{ github.repository }}/frontend
  # Matches `rust-version` in dns/Cargo.toml and the builder image in dns/Dockerfile.
  RUST_VERSION: "1.93.0"
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22"
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  # --- 0. Version -----------------------------------------------------------------------------
  # Runs first and takes seconds, so a typo'd version or an already-published one fails the run
  # before any Rust compile or image build has started.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      major_minor: ${{ steps.resolve.outputs.major_minor }}
      stable: ${{ steps.resolve.outputs.stable }}
    steps:
      - name: Resolve and check the version
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Manual dispatch wins; otherwise the version comes out of the branch name that
          # triggered the push, release/v1.4.0 -> 1.4.0.
          if [ -n "${INPUT_VERSION}" ]; then
            raw=$INPUT_VERSION
            source="the workflow_dispatch input"
          else
            raw=${BRANCH#release/}
            source="branch $BRANCH"
          fi

          # Tolerate a leading v and stray whitespace from the dispatch form.
          raw=$(echo "$raw" | tr -d '[:space:]')
          version=${raw#v}
          version=${version#V}

          # No build metadata (`+sha`): a plus sign is legal in semver but not in a Docker tag,
          # and these versions have to work as both.
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not read a usable version from ${source}: '${raw}'. Expected MAJOR.MINOR.PATCH with an optional prerelease suffix, so a branch named release/v1.4.0 or release/v1.4.0-rc.1."
            exit 1
          fi

          tag="v${version}"
          core=${version%%-*}
          major_minor=${core%.*}

          # A prerelease publishes only its exact version: it must not move `latest` or the
          # `major.minor` alias onto an untested build.
          stable=true
          case "$version" in
            *-*) stable=false ;;
          esac

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Pick a new version, or delete that release first."
            exit 1
          fi

          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
            echo "::error::Tag $tag already exists. This workflow creates the tag at the commit it runs on, so publishing would silently use the existing tag's commit instead. Delete the tag or pick a new version."
            exit 1
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "major_minor=$major_minor"
            echo "stable=$stable"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Publishing \`$tag\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Version | \`$version\` |"
            echo "| Taken from | $source |"
            echo "| Image tags | \`$version\`$([ "$stable" = true ] && echo ", \`$major_minor\`, \`latest\`") |"
            echo "| Prerelease | $([ "$stable" = true ] && echo "no" || echo "yes") |"
            echo "| Commit | \`$GITHUB_SHA\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # --- 1. Tests -------------------------------------------------------------------------------
  test-dns:
    name: Test DNS crates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dns
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dns

      - name: Build tests
        run: cargo test --workspace --locked --no-run

      - name: Run tests
        run: cargo test --workspace --locked

  test-management:
    name: Test management backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management-backend
    steps:
      - uses: actions/checkout@v5

      - name: Install .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # setup-dotnet's own cache wants a packages.lock.json, which this solution does not use,
      # so key the package cache off the project files instead.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('management-backend/**/*.csproj', 'management-backend/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Hermes.Mgmt.slnx

      # Release, because Directory.Build.props turns warnings into errors and that is the
      # configuration the image is published from.
      - name: Build
        run: dotnet build Hermes.Mgmt.slnx -c Release --no-restore

      # No LogFileName: the three test projects run in parallel and would otherwise race for the
      # same .trx. Left to itself the logger names each file after its assembly.
      - name: Test
        run: dotnet test Hermes.Mgmt.slnx -c Release --no-build --logger trx --results-directory ../test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: management-test-results
          path: test-results
          if-no-files-found: ignore

  # --- 2. Images ------------------------------------------------------------------------------
  build-dns-image:
    name: Build & push DNS image
    needs: [prepare, test-dns]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.DNS_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Hermes DNS
            org.opencontainers.image.description=Hermes authoritative DNS server
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      # `load` only, deliberately: buildx refuses to export to the local daemon and to a registry
      # in the same build, and the release binary has to come out of this image rather than from a
      # second compile. The image is pushed from the daemon further down, so the binary attached
      # to the release and the published image are the same build.
      #
      # linux/amd64 only: cross-building this workspace under QEMU costs far more than an arm64
      # image is currently worth.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: dns
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=dns
          cache-to: type=gha,scope=dns,mode=max

      - name: Extract the hermes binary
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          container=$(docker create "$IMAGE")
          docker cp "$container:/usr/local/bin/hermes" hermes
          docker rm --force "$container" > /dev/null
          chmod +x hermes
          file hermes
          sha256sum hermes

      - name: Push the image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while read -r tag; do
            [ -n "$tag" ] || continue
            echo "::group::push $tag"
            docker push "$tag"
            echo "::endgroup::"
          done <<< "$TAGS"

      # Note: upload-artifact zips its payload and the executable bit does not survive, so the
      # release job sets it again after downloading.
      - name: Upload the DNS binary
        uses: actions/upload-artifact@v4
        with:
          name: hermes-dns-linux-x86_64
          path: hermes
          if-no-files-found: error
          retention-days: 7

  build-management-image:
    name: Build & push management image
    needs: [prepare, test-management]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MGMT_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Hermes management API
            org.opencontainers.image.description=Hermes management backend serving the dashboard and the DNS fleet
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: management-backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=management
          cache-to: type=gha,scope=management,mode=max

  build-frontend-image:
    name: Build & push frontend image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.major_minor }},enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable == 'true' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Hermes dashboard
            org.opencontainers.image.description=Hermes management dashboard, server-rendered by react-router-serve
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}

      # This image runs its own `npm run build` inside the Dockerfile, so it does not reuse the
      # bundle from build-frontend. The VITE_* values are inlined into the client bundle at build
      # time, so they go in as build args; same repository variables as the zip job, and anything
      # left unset falls back to the defaults in app/lib/config.ts. Build args are visible in the
      # image history and in the shipped JS, so none of these may be a secret.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_USE_MOCK_API=${{ vars.VITE_USE_MOCK_API }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_COGNITO_REGION=${{ vars.VITE_COGNITO_REGION }}
            VITE_COGNITO_USER_POOL_ID=${{ vars.VITE_COGNITO_USER_POOL_ID }}
            VITE_COGNITO_CLIENT_ID=${{ vars.VITE_COGNITO_CLIENT_ID }}
            VITE_COGNITO_DOMAIN=${{ vars.VITE_COGNITO_DOMAIN }}
            VITE_COGNITO_REDIRECT_URI=${{ vars.VITE_COGNITO_REDIRECT_URI }}
            VITE_COGNITO_LOGOUT_URI=${{ vars.VITE_COGNITO_LOGOUT_URI }}
            VITE_COGNITO_SCOPES=${{ vars.VITE_COGNITO_SCOPES }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # --- 3. Frontend bundle ---------------------------------------------------------------------
  build-frontend:
    name: Build frontend bundle
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Every VITE_* value is baked into the client bundle at build time, so they have to be set
      # here rather than at deploy time. Set them as repository variables; anything left unset
      # falls back to the defaults in app/lib/config.ts (mock API, localhost URLs).
      - name: Build
        run: npm run build
        env:
          VITE_USE_MOCK_API: ${{ vars.VITE_USE_MOCK_API }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_COGNITO_REGION: ${{ vars.VITE_COGNITO_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ vars.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
          VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
          VITE_COGNITO_SCOPES: ${{ vars.VITE_COGNITO_SCOPES }}

      # The app is server-rendered, so the zip carries the package manifests next to build/ as
      # well: unpack it, `npm ci --omit=dev`, `npm run start`. build/client on its own is not
      # servable — with `ssr: true` the build emits no HTML at all, so every document response
      # has to come from build/server/index.js.
      - name: Package the bundle
        run: zip -r --quiet ../hermes-frontend.zip build package.json package-lock.json

      - name: Upload the frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: hermes-frontend
          path: hermes-frontend.zip
          if-no-files-found: error
          retention-days: 7

  # --- 4. Release -----------------------------------------------------------------------------
  release:
    name: Release
    needs: [prepare, build-dns-image, build-management-image, build-frontend-image, build-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download the DNS binary
        uses: actions/download-artifact@v4
        with:
          name: hermes-dns-linux-x86_64
          path: assets

      - name: Download the frontend bundle
        uses: actions/download-artifact@v4
        with:
          name: hermes-frontend
          path: assets

      - name: Name the assets after the version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          # An expression that does not resolve yields an empty string rather than an error, so
          # a missing step id upstream would otherwise show up as oddly named assets and a
          # confusing `gh release create` usage dump.
          if [ -z "$TAG" ]; then
            echo "::error::No tag reached this job — the prepare job's outputs are empty."
            exit 1
          fi

          cd assets
          chmod +x hermes
          mv hermes "hermes-dns-${TAG}-x86_64-linux"
          mv hermes-frontend.zip "hermes-frontend-${TAG}.zip"
          sha256sum * > SHA256SUMS
          ls -l

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          set -euo pipefail
          repo_lc=${GITHUB_REPOSITORY,,}
          version=$VERSION

          # gh refuses --generate-notes alongside --notes-file, so fetch the generated changelog
          # through the API and append it to the hand-written part.
          changelog=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" --jq .body 2>/dev/null || echo "")

          {
            echo "## Container images"
            echo
            echo '```'
            echo "docker pull ghcr.io/${repo_lc}/dns:${version}"
            echo "docker pull ghcr.io/${repo_lc}/management:${version}"
            echo "docker pull ghcr.io/${repo_lc}/frontend:${version}"
            echo '```'
            echo
            echo "## Assets"
            echo
            echo "- \`hermes-dns-${TAG}-x86_64-linux\` — the DNS server binary for x86_64 Linux."
            echo "  Built against glibc 2.36 (Debian bookworm), so it runs on Ubuntu 22.04 and newer."
            echo "  It takes the server and zones config as arguments:"
            echo "  \`./hermes-dns-${TAG}-x86_64-linux server.toml zones.toml\`"
            echo "- \`hermes-frontend-${TAG}.zip\` — the built dashboard (\`build/\`) plus the package"
            echo "  manifests. Unpack it, run \`npm ci --omit=dev\`, then \`npm run start\`."
            echo "- \`SHA256SUMS\` — checksums for the two files above."
            echo
            if [ -n "${changelog}" ]; then
              echo "${changelog}"
            fi
          } > notes.md

          prerelease=()
          if [ "$STABLE" != "true" ]; then
            prerelease=(--prerelease)
          fi

          # --target creates the tag at the commit being published; the tag does not exist yet,
          # which `prepare` has already confirmed.
          gh release create "${TAG}" \
            --title "Hermes ${TAG}" \
            --notes-file notes.md \
            --target "${GITHUB_SHA}" \
            "${prerelease[@]}" \
            assets/*

          {
            echo "### Published [\`$TAG\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})"
            echo
            echo "Tagged \`${GITHUB_SHA}\`."
          } >> "$GITHUB_STEP_SUMMARY"
