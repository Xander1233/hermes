[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Xander1233/Hermes"
rust-version = "1.93.0"

[workspace.dependencies]
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
socket2 = "0.6.4"
num_cpus = "1.17.0"
thiserror = "2.0.18"
core_affinity = "0.8.3"
num_enum = "0.7.6"
toml = "1.1.3"
arc-swap = "1.9.2"
hickory-resolver = "0.26.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
axum = "0.8.9"

serde = { version = "1.0.228", features = ["derive"] }
serde_with = { version = "3.21.0", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "1.0.150"
serde_repr = "0.1.20"
humantime-serde = "1.1.1"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2.5"
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32.0", features = ["trace", "logs", "metrics"] }
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio", "trace", "logs", "metrics"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.32.0"

anyhow = "1.0.102"
time = { version = "0.3.47", features = ["serde", "formatting", "macros"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
os_info = "3.15.0"
hostname = "0.4.2"
libc = "0.2.185"
