# Example DNS data served by Hermes.
#
# Each [[zone]] declares an authoritative zone. A zone must have an [zone.soa] table, and
# may declare any number of [[zone.record]] entries. A zone apex can be of any depth
# (e.g. "example.com" or "zone.example.com").

[[zone]]
apex = "example.com"

[zone.soa]
mname = "ns1.example.com"        # primary name server
rname = "hostmaster.example.com" # responsible party mailbox
serial = 2024010101
refresh = 3600
retry = 600
expire = 604800
minimum = 60
ttl = 3600

# Apex address.
[[zone.record]]
name = "example.com"
type = "A"
ttl = 300
data = "93.184.216.34"

# Authoritative name server for the zone.
[[zone.record]]
name = "example.com"
type = "NS"
ttl = 3600
data = "ns1.example.com"

[[zone.record]]
name = "ns1.example.com"
type = "A"
ttl = 3600
data = "93.184.216.36"

# Mail routing.
[[zone.record]]
name = "example.com"
type = "MX"
ttl = 3600
preference = 10
data = "mail.example.com"

[[zone.record]]
name = "mail.example.com"
type = "A"
ttl = 300
data = "93.184.216.35"

# www and an alias pointing at it.
[[zone.record]]
name = "www.example.com"
type = "A"
ttl = 300
data = "93.184.216.34"

[[zone.record]]
name = "alias.example.com"
type = "CNAME"
ttl = 300
data = "www.example.com"

# A TXT record.
[[zone.record]]
name = "example.com"
type = "TXT"
ttl = 3600
data = "v=spf1 -all"

[[zone.record]]
name = "*.example.com"
type = "A"
ttl = 300
data = "93.184.216.35"


[[zone]]
apex = "another.org"

[zone.soa]
mname = "ns1.another.org"
rname = "hostmaster.another.org"
serial = 2024010101
refresh = 3600
retry = 600
expire = 604800
minimum = 60
ttl = 3600

[[zone.record]]
name = "another.org"
type = "ALIAS"
ttl = 300
data = "api.david-neidhart.de"

[[zone.record]]
name = "another.org"
type = "MX"
ttl = 3600
preference = 10
data = "mail.example.com"